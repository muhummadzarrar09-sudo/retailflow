      <ellipse cx="24" cy="9.6" rx="4.5" ry="8.6" transform="rotate(60 24 24)"/>
      <ellipse cx="24" cy="9.6" rx="4.5" ry="8.6" transform="rotate(90 24 24)"/>
      <ellipse cx="24" cy="9.6" rx="4.5" ry="8.6" transform="rotate(120 24 24)"/>
      <ellipse cx="24" cy="9.6" rx="4.5" ry="8.6" transform="rotate(150 24 24)"/>
      <ellipse cx="24" cy="9.6" rx="4.5" ry="8.6" transform="rotate(180 24 24)"/>
      <ellipse cx="24" cy="9.6" rx="4.5" ry="8.6" transform="rotate(210 24 24)"/>
      <ellipse cx="24" cy="9.6" rx="4.5" ry="8.6" transform="rotate(240 24 24)"/>
      <ellipse cx="24" cy="9.6" rx="4.5" ry="8.6" transform="rotate(270 24 24)"/>
      <ellipse cx="24" cy="9.6" rx="4.5" ry="8.6" transform="rotate(300 24 24)"/>
      <ellipse cx="24" cy="9.6" rx="4.5" ry="8.6" transform="rotate(330 24 24)"/>
    </g>
    <g fill="#C25A2C" opacity="0.95">
