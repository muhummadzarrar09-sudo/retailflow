<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" width="420" height="96" role="img" aria-label="Marigold &amp; Clay — Curated General Store">
  <defs>
    <radialGradient id="l-petal" cx="50%" cy="36%" r="68%">
      <stop offset="0%" stop-color="#F5C68C"/>
      <stop offset="52%" stop-color="#DD7A33"/>
      <stop offset="100%" stop-color="#A94A22"/>
    </radialGradient>
    <radialGradient id="l-core" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#FCF3E1"/>
