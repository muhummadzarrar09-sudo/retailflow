      <ellipse cx="24" cy="16" rx="3.3" ry="6.2" transform="rotate(100 24 24)"/>
      <ellipse cx="24" cy="16" rx="3.3" ry="6.2" transform="rotate(140 24 24)"/>
      <ellipse cx="24" cy="16" rx="3.3" ry="6.2" transform="rotate(180 24 24)"/>
      <ellipse cx="24" cy="16" rx="3.3" ry="6.2" transform="rotate(220 24 24)"/>
      <ellipse cx="24" cy="16" rx="3.3" ry="6.2" transform="rotate(260 24 24)"/>
      <ellipse cx="24" cy="16" rx="3.3" ry="6.2" transform="rotate(300 24 24)"/>
