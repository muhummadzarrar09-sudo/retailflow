<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF5EA" />
    <title>Marigold &amp; Clay — Curated General Store</title>
    <meta
      name="description"
      content="A premium storefront demo: browse the catalog, filter products, and order through WhatsApp in one clean message."
    />
    <meta property="og:title" content="Marigold &amp; Clay — Curated General Store" />
    <meta
      property="og:description"
      content="A working storefront demo — shop the catalog and order in one clean WhatsApp message."
    />
    <meta property="og:type" content="website" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "Marigold & Clay",
        "description": "Demo curated general store — clothing, accessories, stationery, cosmetics and gifts.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Rawalpindi",
          "addressRegion": "Punjab",
          "addressCountry": "PK"
        },
        "openingHours": "Mo-Sa 11:00-21:00",
        "paymentAccepted": "Cash on delivery, Bank transfer",
        "currenciesAccepted": "PKR",
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "A/W '26 Curated Catalog",
          "numberOfItems": 25,
          "itemListElement": [
            { "@type": "OfferCatalog", "name": "Clothing" },
            { "@type": "OfferCatalog", "name": "Accessories" },
            { "@type": "OfferCatalog", "name": "Footwear" },
            { "@type": "OfferCatalog", "name": "Stationery" },
            { "@type": "OfferCatalog", "name": "Cosmetics" },
            { "@type": "OfferCatalog", "name": "Gifts" }
          ]
        }
      }
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%23BF5B2D'/%3E%3Crect x='10' y='12' width='20' height='3.4' rx='1.7' fill='%23FAF5EA'/%3E%3Crect x='10' y='18.3' width='14' height='3.4' rx='1.7' fill='%23FAF5EA'/%3E%3Crect x='10' y='24.6' width='8' height='3.4' rx='1.7' fill='%23FAF5EA'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Manrope:wght@400..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
